<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm Bài Kiểm Tra Thích Ứng - KHTN</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans text-gray-800">

  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden p-6 md:p-8">
    
    <header class="border-b pb-4 mb-6 text-center">
      <h1 class="text-2xl md:text-3xl font-extrabold text-blue-700 tracking-tight" id="header-title">BÀI KIỂM TRA THÍCH ỨNG KHTN</h1>
      <p class="text-sm text-gray-500 mt-1" id="header-desc">Hệ thống phân hóa và chẩn đoán năng lực học tập tự động</p>
    </header>

    <!-- Màn hình 1: Nhập thông tin học sinh -->
    <div id="login-screen" class="space-y-4 max-w-md mx-auto">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Mã bài kiểm tra</label>
        <input type="text" id="exam-code-input" placeholder="VD: KHTN9-HK1 (hoặc để trống nếu làm toàn bộ)" class="w-full border rounded-lg px-3 py-2 uppercase font-mono font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và tên học sinh</label>
        <input type="text" id="student-name" placeholder="Ví dụ: Nguyễn Văn An" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mã học sinh</label>
          <input type="text" id="student-code" placeholder="VD: HS01" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Lớp</label>
          <input type="text" id="student-class" placeholder="VD: 9A1" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>
      <button onclick="startExamSession()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition duration-200 shadow mt-2">
        Bắt đầu làm bài
      </button>
    </div>

    <!-- Màn hình 2: Khu vực làm bài -->
    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-6 bg-blue-50 p-3 rounded-lg border border-blue-100">
        <span id="display-student" class="font-semibold text-blue-900"></span>
        <span id="quiz-phase-badge" class="bg-blue-200 text-blue-800 text-xs px-2.5 py-1 rounded-full font-bold">VÒNG ĐÁNH GIÁ ĐẦU VÀO</span>
      </div>

      <div id="questions-container" class="space-y-8"></div>

      <div class="mt-8 pt-4 border-t">
        <button onclick="submitExam()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow text-lg">
          Nộp bài kiểm tra
        </button>
      </div>
    </div>

    <!-- Màn hình 3: Kết quả và Đề xuất Thích ứng -->
    <div id="result-screen" class="hidden space-y-6">
      <div class="bg-gray-50 border rounded-xl p-6 text-center">
        <h2 class="text-xl font-bold text-gray-800 mb-2">KẾT QUẢ ĐÁNH GIÁ NĂNG LỰC</h2>
        <div id="score-display" class="text-4xl font-extrabold text-blue-600 my-2">0/0</div>
        <p id="feedback-text" class="text-gray-600 mt-2 text-sm md:text-base"></p>
      </div>

      <div id="weakness-box" class="hidden border border-amber-200 bg-amber-50 rounded-xl p-5">
        <h3 class="font-bold text-amber-900 flex items-center gap-2">
          <span>⚠️</span> Các kỹ năng cần củng cố ngay:
        </h3>
        <ul id="weakness-list" class="list-disc list-inside mt-2 text-sm text-amber-800 space-y-1"></ul>
        
        <button onclick="startAdaptiveRemediation()" class="mt-4 w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition shadow">
          Bắt đầu luyện tập thích ứng theo lỗ hổng kiến thức
        </button>
      </div>

      <div>
        <h3 class="font-bold text-lg mb-4 text-gray-800">Giải thích chi tiết từng câu:</h3>
        <div id="review-container" class="space-y-6"></div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_BASE = "https://fquizalynoibtuibyoxn.supabase.co/rest/v1";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdWl6YWx5bm9pYnR1aWJ5b3huIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjkzNzUyMywiZXhwIjoyMTA4NTEzNTIzfQ.MhhxAnxr3ujueLGUH7QFpWPP0N2au8edOw3k2O2XgJE";

    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    };

    let allQuestions = [];
    let currentExamQuestions = [];
    let userAnswers = {};
    let studentInfo = { name: "", code: "", className: "", examCode: "" };
    let missingSkills = [];

    // Tự động điền mã đề nếu có tham số trên URL (?exam=XYZ)
    const urlParams = new URLSearchParams(window.location.search);
    const paramExam = urlParams.get('exam');
    if (paramExam) {
      document.getElementById('exam-code-input').value = paramExam.toUpperCase();
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatSkillName(skill) {
      if (!skill) return "";
      return skill.toLowerCase().replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function renderKaTeXText(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: false},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function prepareExamQuestions(rawQuestions) {
      const shuffled = shuffleArray(rawQuestions);
      return shuffled.map(q => {
        const originalOptions = [
          { key: 'A', text: q.option_a },
          { key: 'B', text: q.option_b },
          { key: 'C', text: q.option_c },
          { key: 'D', text: q.option_d }
        ].filter(opt => opt.text !== null && opt.text !== undefined && opt.text !== "");

        const correctKey = (q.correct_option || 'A').toLowerCase();
        const correctText = q[`option_${correctKey}`];

        const randomized = shuffleArray(originalOptions);
        const letters = ['A', 'B', 'C', 'D'];
        let newCorrect = 'A';

        const finalOptions = randomized.map((opt, idx) => {
          const label = letters[idx];
          if (opt.text === correctText) newCorrect = label;
          return { label, text: opt.text };
        });

        return {
          ...q,
          shuffledOptions: finalOptions,
          newCorrectOption: newCorrect
        };
      });
    }

    async function startExamSession() {
      const name = document.getElementById("student-name").value.trim();
      const code = document.getElementById("student-code").value.trim();
      const className = document.getElementById("student-class").value.trim();
      const examCode = document.getElementById("exam-code-input").value.trim().toUpperCase();

      if (!name || !code || !className) {
        alert("Vui lòng điền Họ tên, Mã số học sinh và Lớp!");
        return;
      }

      studentInfo = { name, code, className, examCode };

      // 1. Tải câu hỏi theo cấu hình mã đề của GV hoặc lấy mặc định
      let questionPool = [];
      if (examCode) {
        try {
          const examRes = await fetch(`${SUPABASE_BASE}/exams?exam_code=eq.${examCode}`, { headers });
          const examData = await examRes.json();
          if (examData.length > 0) {
            const config = examData[0];
            const topicsParam = config.selected_topics.map(t => `"${t}"`).join(",");
            const qRes = await fetch(`${SUPABASE_BASE}/questions?skill_code=in.(${topicsParam})`, { headers });
            const pool = await qRes.json();
            questionPool = shuffleArray(pool).slice(0, config.question_count || 15);
          } else {
            alert(`Không tìm thấy mã đề "${examCode}". Hệ thống sẽ tải đề mặc định từ ngân hàng.`);
            const qRes = await fetch(`${SUPABASE_BASE}/questions?select=*`, { headers });
            questionPool = await qRes.json();
          }
        } catch (e) {
          alert("Lỗi tải đề thi!");
          return;
        }
      } else {
        const qRes = await fetch(`${SUPABASE_BASE}/questions?select=*`, { headers });
        questionPool = await qRes.json();
      }

      allQuestions = questionPool;
      currentExamQuestions = prepareExamQuestions(questionPool);
      userAnswers = {};

      document.getElementById("display-student").innerText = `${name} (${code} - ${className}) ${examCode ? ' | Mã đề: ' + examCode : ''}`;
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById("questions-container");
      container.innerHTML = "";

      currentExamQuestions.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "p-5 border rounded-xl bg-white shadow-sm";

        let imageHtml = "";
        if (q.image_url) {
          imageHtml = `
            <div class="my-4 text-center">
              <img src="${q.image_url}" alt="Hình minh họa" class="max-h-64 mx-auto rounded-lg shadow-sm border border-gray-200 object-contain">
            </div>
          `;
        }

        let optionsHtml = "";
        q.shuffledOptions.forEach(opt => {
          optionsHtml += `
            <label class="flex items-start gap-3 p-3 border rounded-lg hover:bg-blue-50 cursor-pointer transition">
              <input type="radio" name="q_${index}" value="${opt.label}" onchange="selectAnswer(${index}, '${opt.label}')" class="mt-1 text-blue-600 focus:ring-blue-500">
              <span class="text-sm md:text-base"><strong class="text-blue-700">${opt.label}.</strong> ${opt.text}</span>
            </label>
          `;
        });

        card.innerHTML = `
          <div class="font-semibold text-gray-800 text-base md:text-lg mb-2">Câu ${index + 1}: ${q.content}</div>
          ${imageHtml}
          <div class="space-y-2 mt-3">${optionsHtml}</div>
        `;

        container.appendChild(card);
      });

      renderKaTeXText(container);
    }

    function selectAnswer(index, option) {
      userAnswers[index] = option;
    }

    async function submitExam() {
      if (Object.keys(userAnswers).length < currentExamQuestions.length) {
        if (!confirm("Bạn chưa hoàn thành hết các câu hỏi. Bạn vẫn muốn nộp bài chứ?")) return;
      }

      let score = 0;
      missingSkills = [];
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";

      currentExamQuestions.forEach((q, index) => {
        const selected = userAnswers[index];
        const isCorrect = selected === q.newCorrectOption;
        if (isCorrect) {
          score++;
        } else {
          if (q.skill_code && !missingSkills.includes(q.skill_code)) {
            missingSkills.push(q.skill_code);
          }
        }

        const revCard = document.createElement("div");
        revCard.className = `p-4 border rounded-xl ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
        
        let imgRevHtml = q.image_url ? `<div class="my-2 text-center"><img src="${q.image_url}" class="max-h-48 mx-auto rounded border"></div>` : "";

        revCard.innerHTML = `
          <div class="font-medium text-gray-900">Câu ${index + 1}: ${q.content}</div>
          ${imgRevHtml}
          <div class="mt-2 text-sm">
            <span class="${isCorrect ? 'text-green-700 font-bold' : 'text-red-700 font-bold'}">
              Lựa chọn của bạn: ${selected || "Chưa chọn"} ${isCorrect ? '✓' : '✗'}
            </span>
            <span class="ml-4 text-blue-700 font-bold">Đáp án đúng: ${q.newCorrectOption}</span>
          </div>
          <div class="mt-2 text-xs bg-white p-3 rounded border text-gray-700">
            <strong>Lời giải:</strong> ${q.explanation || "Không có lời giải chi tiết."}
          </div>
        `;
        reviewContainer.appendChild(revCard);
      });

      renderKaTeXText(reviewContainer);

      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      document.getElementById("score-display").innerText = `${score} / ${currentExamQuestions.length}`;

      const validSkills = missingSkills.filter(s => String(s).trim().length > 2 && isNaN(String(s).trim()));
      const weaknessBox = document.getElementById("weakness-box");
      const weaknessList = document.getElementById("weakness-list");
      weaknessList.innerHTML = "";

      if (validSkills.length > 0) {
        weaknessBox.classList.remove("hidden");
        validSkills.forEach(s => {
          const li = document.createElement("li");
          li.innerText = formatSkillName(s);
          weaknessList.appendChild(li);
        });
        document.getElementById("feedback-text").innerText = "Bạn có một số kiến thức cần củng cố để đạt chuẩn đầu ra.";
      } else {
        weaknessBox.classList.add("hidden");
        document.getElementById("feedback-text").innerText = "Xuất sắc! Bạn đã đạt chuẩn toàn bộ các kỹ năng trong bài kiểm tra.";
      }

      // Lưu kết quả vào Supabase để bảng điều khiển của GV theo dõi
      try {
        fetch(`${SUPABASE_BASE}/submissions`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            exam_code: studentInfo.examCode || null,
            student_name: studentInfo.name,
            student_code: studentInfo.code,
            class_name: studentInfo.className,
            score: score,
            total_questions: currentExamQuestions.length,
            weak_skills: validSkills
          })
        });
      } catch (e) {
        console.log("Supabase save silent fail");
      }
    }

    function startAdaptiveRemediation() {
      const adaptive = allQuestions.filter(q => missingSkills.includes(q.skill_code));
      if (adaptive.length === 0) {
        alert("Hiện chưa có thêm câu hỏi bổ trợ cho các kỹ năng này!");
        return;
      }
      currentExamQuestions = prepareExamQuestions(adaptive);
      userAnswers = {};

      document.getElementById("quiz-phase-badge").innerText = "VÒNG 2: BỔ TRỢ THÍCH ỨNG THEO LỖ HỔNG";
      document.getElementById("quiz-phase-badge").className = "bg-amber-200 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold";
      
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderQuiz();
    }
  </script>
</body>
</html>
