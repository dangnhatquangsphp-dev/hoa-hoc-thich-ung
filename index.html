<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Đánh Giá & Học Tập Thích Ứng Hóa Học</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4 font-sans text-gray-800">

  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden p-6 md:p-8">
    
    <header class="border-b pb-4 mb-6 text-center">
      <h1 class="text-2xl md:text-3xl font-extrabold text-blue-700 tracking-tight">KIỂM TRA & ĐÁNH GIÁ THÍCH ỨNG</h1>
      <p class="text-sm text-gray-500 mt-1">Đề thi tự động xáo trộn câu hỏi và phương án theo từng lượt làm</p>
    </header>

    <!-- Màn hình 1: Nhập thông tin học sinh -->
    <div id="login-screen" class="space-y-4 max-w-md mx-auto">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Họ và tên học sinh</label>
        <input type="text" id="student-name" placeholder="Ví dụ: Nguyễn Văn An" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Mã số học sinh / Lớp</label>
        <input type="text" id="student-code" placeholder="Ví dụ: HS01 - Lớp 9A" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button onclick="startExam()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition duration-200 shadow">
        Bắt đầu làm bài
      </button>
    </div>

    <!-- Màn hình 2: Khu vực làm bài -->
    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center mb-6 bg-blue-50 p-3 rounded-lg border border-blue-100">
        <span id="display-student" class="font-semibold text-blue-900"></span>
        <span id="quiz-phase-badge" class="bg-blue-200 text-blue-800 text-xs px-2.5 py-1 rounded-full font-bold">VÒNG ĐÁNH GIÁ ĐẦU VÀO</span>
      </div>

      <div id="questions-container" class="space-y-8"></div>

      <div class="mt-8 pt-4 border-t">
        <button onclick="submitExam()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow text-lg">
          Nộp bài kiểm tra
        </button>
      </div>
    </div>

    <!-- Màn hình 3: Kết quả và Đề xuất Thích ứng -->
    <div id="result-screen" class="hidden space-y-6">
      <div class="bg-gray-50 border rounded-xl p-6 text-center">
        <h2 class="text-xl font-bold text-gray-800 mb-2">KẾT QUẢ ĐÁNH GIÁ NĂNG LỰC</h2>
        <div id="score-display" class="text-4xl font-extrabold text-blue-600 my-2">0/0</div>
        <p id="feedback-text" class="text-gray-600 mt-2 text-sm md:text-base"></p>
      </div>

      <div id="weakness-box" class="hidden border border-amber-200 bg-amber-50 rounded-xl p-5">
        <h3 class="font-bold text-amber-900 flex items-center gap-2">
          <span>⚠️</span> Các kỹ năng cần củng cố ngay:
        </h3>
        <ul id="weakness-list" class="list-disc list-inside mt-2 text-sm text-amber-800 space-y-1"></ul>
        
        <button onclick="startAdaptiveRemediation()" class="mt-4 w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-lg transition shadow">
          Bắt đầu luyện tập thích ứng theo lỗ hổng kiến thức
        </button>
      </div>

      <div>
        <h3 class="font-bold text-lg mb-4 text-gray-800">Giải thích chi tiết từng câu:</h3>
        <div id="review-container" class="space-y-6"></div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://fquizalynoibtuibyoxn.supabase.co/rest/v1/questions?select=*";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdWl6YWx5bm9pYnR1aWJ5b3huIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MjkzNzUyMywiZXhwIjoyMTA4NTEzNTIzfQ.MhhxAnxr3ujueLGUH7QFpWPP0N2au8edOw3k2O2XgJE";
    const GOOGLE_SHEET_WEBHOOK = "https://script.google.com/macros/s/AKfycbz_9YFkI2n4o0sC9k4q-L7k8V2H9t3f0pQ_example/exec";

    let allQuestions = [];
    let currentExamQuestions = [];
    let userAnswers = {};
    let studentInfo = { name: "", code: "" };
    let missingSkills = [];

    // Thuật toán Fisher-Yates xáo trộn mảng ngẫu nhiên
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function fetchQuestions() {
      try {
        const res = await fetch(SUPABASE_URL, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });
        allQuestions = await res.json();
      } catch (err) {
        alert("Lỗi tải ngân hàng câu hỏi!");
      }
    }
    fetchQuestions();

    function renderKaTeXText(element) {
      if (window.renderMathInElement) {
        renderMathInElement(element, {
          delimiters: [
            {left: '$$', right: '$$', display: false},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    // Chuẩn bị đề thi ngẫu nhiên: Xáo trộn câu hỏi và xáo trộn các phương án
    function prepareExamQuestions(rawQuestions) {
      // 1. Xáo trộn thứ tự các câu hỏi
      const shuffledQuestions = shuffleArray(rawQuestions);

      // 2. Xáo trộn các phương án A, B, C, D của từng câu
      return shuffledQuestions.map(q => {
        const originalOptions = [
          { key: 'A', text: q.option_a },
          { key: 'B', text: q.option_b },
          { key: 'C', text: q.option_c },
          { key: 'D', text: q.option_d }
        ].filter(opt => opt.text !== null && opt.text !== undefined && opt.text !== "");

        // Tìm nội dung đáp án đúng gốc
        const correctText = q[`option_${q.correct_option.toLowerCase()}`];

        // Xáo trộn ngẫu nhiên các phương án
        const randomizedOptions = shuffleArray(originalOptions);

        // Gán lại nhãn A, B, C, D mới sau khi đã xáo
        const letters = ['A', 'B', 'C', 'D'];
        let newCorrectOption = 'A';

        const finalShuffledOptions = randomizedOptions.map((opt, idx) => {
          const newLabel = letters[idx];
          if (opt.text === correctText) {
            newCorrectOption = newLabel;
          }
          return {
            label: newLabel,
            text: opt.text
          };
        });

        return {
          ...q,
          shuffledOptions: finalShuffledOptions,
          newCorrectOption: newCorrectOption
        };
      });
    }

    function startExam() {
      const name = document.getElementById("student-name").value.trim();
      const code = document.getElementById("student-code").value.trim();
      if (!name || !code) {
        alert("Vui lòng điền đầy đủ Họ tên và Mã học sinh!");
        return;
      }
      studentInfo = { name, code };
      document.getElementById("display-student").innerText = `${name} (${code})`;

      // Tạo đề mới xáo trộn hoàn toàn
      currentExamQuestions = prepareExamQuestions(allQuestions);
      userAnswers = {};

      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      renderQuiz();
    }

    function renderQuiz() {
      const container = document.getElementById("questions-container");
      container.innerHTML = "";

      currentExamQuestions.forEach((q, index) => {
        const card = document.createElement("div");
        card.className = "p-5 border rounded-xl bg-white shadow-sm";

        let imageHtml = "";
        if (q.image_url) {
          imageHtml = `
            <div class="my-4 text-center">
              <img src="${q.image_url}" alt="Hình minh họa" class="max-h-64 mx-auto rounded-lg shadow-sm border border-gray-200 object-contain">
            </div>
          `;
        }

        let optionsHtml = "";
        q.shuffledOptions.forEach(opt => {
          optionsHtml += `
            <label class="flex items-start gap-3 p-3 border rounded-lg hover:bg-blue-50 cursor-pointer transition">
              <input type="radio" name="q_${index}" value="${opt.label}" onchange="selectAnswer(${index}, '${opt.label}')" class="mt-1 text-blue-600 focus:ring-blue-500">
              <span class="text-sm md:text-base"><strong class="text-blue-700">${opt.label}.</strong> ${opt.text}</span>
            </label>
          `;
        });

        card.innerHTML = `
          <div class="font-semibold text-gray-800 text-base md:text-lg mb-2">Câu ${index + 1}: ${q.content}</div>
          ${imageHtml}
          <div class="space-y-2 mt-3">${optionsHtml}</div>
        `;

        container.appendChild(card);
      });

      renderKaTeXText(container);
    }

    function selectAnswer(qIndex, option) {
      userAnswers[qIndex] = option;
    }

    async function submitExam() {
      if (Object.keys(userAnswers).length < currentExamQuestions.length) {
        if (!confirm("Bạn chưa hoàn thành hết các câu hỏi. Bạn vẫn muốn nộp bài chứ?")) {
          return;
        }
      }

      let score = 0;
      missingSkills = [];
      const reviewContainer = document.getElementById("review-container");
      reviewContainer.innerHTML = "";

      currentExamQuestions.forEach((q, index) => {
        const selected = userAnswers[index];
        const isCorrect = selected === q.newCorrectOption;
        if (isCorrect) {
          score++;
        } else {
          if (q.skill_code && !missingSkills.includes(q.skill_code)) {
            missingSkills.push(q.skill_code);
          }
        }

        const revCard = document.createElement("div");
        revCard.className = `p-4 border rounded-xl ${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`;
        
        let imgRevHtml = q.image_url ? `<div class="my-2 text-center"><img src="${q.image_url}" class="max-h-48 mx-auto rounded border"></div>` : "";

        revCard.innerHTML = `
          <div class="font-medium text-gray-900">Câu ${index + 1}: ${q.content}</div>
          ${imgRevHtml}
          <div class="mt-2 text-sm">
            <span class="${isCorrect ? 'text-green-700 font-bold' : 'text-red-700 font-bold'}">
              Lựa chọn của bạn: ${selected || "Chưa chọn"} ${isCorrect ? '✓' : '✗'}
            </span>
            <span class="ml-4 text-blue-700 font-bold">Đáp án đúng: ${q.newCorrectOption}</span>
          </div>
          <div class="mt-2 text-xs bg-white p-3 rounded border text-gray-700">
            <strong>Lời giải:</strong> ${q.explanation || "Không có lời giải chi tiết."}
          </div>
        `;
        reviewContainer.appendChild(revCard);
      });

      renderKaTeXText(reviewContainer);

      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.remove("hidden");
      document.getElementById("score-display").innerText = `${score} / ${currentExamQuestions.length}`;

      const weaknessBox = document.getElementById("weakness-box");
      const weaknessList = document.getElementById("weakness-list");
      weaknessList.innerHTML = "";

	// Hàm làm sạch và chuyển mã kỹ năng thành tên hiển thị rõ ràng
	function formatSkillName(skill) {
	  if (!skill) return "";
	  // Bỏ dấu gạch dưới và viết hoa chữ cái đầu
	  return skill
		.toLowerCase()
		.replace(/_/g, " ")
		.replace(/\b\w/g, c => c.toUpperCase());
	}

	// Lọc bỏ các giá trị số hoặc ký tự vô nghĩa (như 1, 2, 5, 9...)
	const validSkills = missingSkills.filter(s => {
	  const str = String(s).trim();
	  return str.length > 2 && isNaN(str);
	});

	if (validSkills.length > 0) {
	  weaknessBox.classList.remove("hidden");
	  validSkills.forEach(s => {
		const li = document.createElement("li");
		li.innerText = formatSkillName(s);
		weaknessList.appendChild(li);
	  });
	  document.getElementById("feedback-text").innerText = "Bạn có một số kiến thức cần củng cố để đạt chuẩn đầu ra.";
	} else {
	  weaknessBox.classList.add("hidden");
	  document.getElementById("feedback-text").innerText = "Xuất sắc! Bạn đã đạt chuẩn toàn bộ các kỹ năng trong bài kiểm tra.";
	}

      try {
        fetch(GOOGLE_SHEET_WEBHOOK, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student_name: studentInfo.name,
            student_code: studentInfo.code,
            score: score,
            total: currentExamQuestions.length,
            missing_skills: missingSkills.length > 0 ? missingSkills.join(", ") : "Không có (Đạt chuẩn)"
          })
        });
      } catch (e) {
        console.log("Sheet update silent fail");
      }
    }

    function startAdaptiveRemediation() {
      const adaptiveQuestions = allQuestions.filter(q => missingSkills.includes(q.skill_code));
      if (adaptiveQuestions.length === 0) {
        alert("Hiện chưa có câu hỏi bổ trợ mới cho các kỹ năng này!");
        return;
      }
      
      // Ở vòng bổ trợ cũng xáo trộn lại để học sinh tư duy lại
      currentExamQuestions = prepareExamQuestions(adaptiveQuestions);
      userAnswers = {};

      document.getElementById("quiz-phase-badge").innerText = "VÒNG 2: BỔ TRỢ THÍCH ỨNG THEO LỖ HỔNG";
      document.getElementById("quiz-phase-badge").className = "bg-amber-200 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold";
      
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderQuiz();
    }
  </script>
</body>
</html>
